<svg viewBox="0 0 1200 480" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="1200" height="480" fill="#ffffff"/>

  <!-- Data -->
  <rect x="20" y="180" width="140" height="120" rx="8" fill="#eef2fb" stroke="#3b5bab" stroke-width="1.5"/>
  <text x="90" y="225" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2d5c">Data</text>
  <text x="90" y="245" text-anchor="middle" font-size="11" fill="#333">HCP MOTOR</text>
  <text x="90" y="260" text-anchor="middle" font-size="11" fill="#333">100 subjects</text>
  <text x="90" y="275" text-anchor="middle" font-size="11" fill="#333">32-TR windows</text>

  <line x1="160" y1="240" x2="205" y2="240" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Shared backbone -->
  <rect x="210" y="180" width="150" height="120" rx="8" fill="#eef2fb" stroke="#3b5bab" stroke-width="1.5"/>
  <text x="285" y="220" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2d5c">Shared backbone</text>
  <text x="285" y="242" text-anchor="middle" font-size="11" fill="#333">GRU or Transformer</text>
  <text x="285" y="258" text-anchor="middle" font-size="11" fill="#333">forward_features(x)</text>
  <text x="285" y="274" text-anchor="middle" font-size="11" fill="#333">-&gt; 128-d representation</text>

  <line x1="360" y1="240" x2="405" y2="120" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="360" y1="240" x2="405" y2="240" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="360" y1="240" x2="405" y2="360" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Case 1 -->
  <rect x="410" y="60" width="170" height="110" rx="8" fill="#fdf1e3" stroke="#b9701c" stroke-width="1.5"/>
  <text x="495" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a4a10">Case 1 — Supervised</text>
  <text x="495" y="105" text-anchor="middle" font-size="10.5" fill="#333">multi-task decoder</text>
  <text x="495" y="120" text-anchor="middle" font-size="10.5" fill="#333">classification + HRF regression</text>
  <text x="495" y="140" text-anchor="middle" font-size="10.5" fill="#333">CE + 0.1·MSE</text>

  <!-- Case 2 -->
  <rect x="410" y="185" width="170" height="110" rx="8" fill="#fdf1e3" stroke="#b9701c" stroke-width="1.5"/>
  <text x="495" y="210" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a4a10">Case 2 — Contrastive</text>
  <text x="495" y="230" text-anchor="middle" font-size="10.5" fill="#333">brain aligned to text prototypes</text>
  <text x="495" y="245" text-anchor="middle" font-size="10.5" fill="#333">multi-positive symmetric loss</text>
  <text x="495" y="265" text-anchor="middle" font-size="10.5" fill="#333">labels define positives</text>

  <!-- Case 3 -->
  <rect x="410" y="310" width="170" height="110" rx="8" fill="#fdf1e3" stroke="#b9701c" stroke-width="1.5"/>
  <text x="495" y="335" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a4a10">Case 3 — Self-supervised</text>
  <text x="495" y="355" text-anchor="middle" font-size="10.5" fill="#333">brain aligned to its own HRF</text>
  <text x="495" y="370" text-anchor="middle" font-size="10.5" fill="#333">symmetric InfoNCE</text>
  <text x="495" y="390" text-anchor="middle" font-size="10.5" fill="#333">no label ever used</text>

  <line x1="580" y1="115" x2="625" y2="240" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="580" y1="240" x2="625" y2="240" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="580" y1="365" x2="625" y2="240" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Interpretability -->
  <rect x="630" y="150" width="180" height="180" rx="8" fill="#eaf6ee" stroke="#2f7d43" stroke-width="1.5"/>
  <text x="720" y="180" text-anchor="middle" font-size="14" font-weight="bold" fill="#1c4a29">Interpretability</text>
  <text x="720" y="205" text-anchor="middle" font-size="10.5" fill="#333">8 concepts, CAV/TCAV</text>
  <text x="720" y="222" text-anchor="middle" font-size="10.5" fill="#333">fitted-probe direction,</text>
  <text x="720" y="237" text-anchor="middle" font-size="10.5" fill="#333">standardized across all 3</text>
  <text x="720" y="260" text-anchor="middle" font-size="10.5" fill="#333">30-resample bootstrap</text>
  <text x="720" y="277" text-anchor="middle" font-size="10.5" fill="#333">baseline &amp; ablation controls</text>
  <text x="720" y="300" text-anchor="middle" font-size="10.5" fill="#333">(temporal, ROI-network)</text>

  <line x1="810" y1="240" x2="855" y2="240" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- RAG verification -->
  <rect x="860" y="150" width="200" height="180" rx="8" fill="#f4eaf9" stroke="#7a3fa3" stroke-width="1.5"/>
  <text x="960" y="180" text-anchor="middle" font-size="14" font-weight="bold" fill="#4b1f66">Literature verification</text>
  <text x="960" y="205" text-anchor="middle" font-size="10.5" fill="#333">retrieve + rerank (10-paper corpus)</text>
  <text x="960" y="222" text-anchor="middle" font-size="10.5" fill="#333">LLM extracts stance + claim</text>
  <text x="960" y="245" text-anchor="middle" font-size="10.5" fill="#333">verdict computed deterministically</text>
  <text x="960" y="262" text-anchor="middle" font-size="10.5" fill="#333">from (stance, TCAV score) —</text>
  <text x="960" y="279" text-anchor="middle" font-size="10.5" fill="#333">LLM only narrates the result</text>
  <text x="960" y="302" text-anchor="middle" font-size="10.5" fill="#333">query-first (v1) + claim-first (v2)</text>

  <text x="600" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">NeuroLens-RAG: system overview</text>
  <text x="600" y="460" text-anchor="middle" font-size="11" fill="#666">One shared backbone interface makes 3 training objectives, one interpretability mechanism, and one verification loop mutually compatible.</text>
</svg>

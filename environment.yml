name: neurolens
channels:
  - defaults
  - conda-forge

dependencies:
  - python=3.11
  - pip

  # Scientific Python
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - nilearn
  - nibabel

  # Notebooks and visualization
  - jupyterlab
  - ipykernel
  - matplotlib
  - plotly

  # Configuration and utilities
  - pyyaml
  - tqdm

  # Development
  - pytest
  - ruff

  # Packages installed from PyPI
  - pip:
      - torch
      - pymupdf4llm
      - sentence-transformers
      - streamlit
      - awscli
      - boto3
      - captum
      - lime


